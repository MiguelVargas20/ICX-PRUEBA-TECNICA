spring.application.name=prueba

# Lee el archivo .env de la carpeta backend (por eso hay que arrancar desde ahí).
# "optional" hace que no falle si no existe, por ejemplo si las variables ya están en el sistema.
spring.config.import=optional:file:.env[.properties]

# ===================== Oracle Service Cloud =====================
# Estos valores se guardan en OracleProperties. Los tres primeros vienen del .env
oracle.base-url=${ORACLE_BASE_URL}
oracle.user=${ORACLE_USER}
oracle.password=${ORACLE_PASS}
oracle.api-version=v1.4
oracle.context-header=prueba tecnica


# ===================== Base de datos de respaldo (H2) =====================
# "file:" guarda la base en un archivo (backend/data/) para que no se pierda al reiniciar.
# Con "mem:" se borraría cada vez que se apaga el backend.
spring.datasource.url=jdbc:h2:file:./data/respaldo-contactos
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas solo a partir de las clases @Entity
spring.jpa.hibernate.ddl-auto=update
# Para no dejar la conexión a la base abierta durante toda la petición
spring.jpa.open-in-view=false

# Consola para ver las tablas: http://localhost:8080/h2-console
# Si se despliega en un servidor se puede apagar con la variable H2_CONSOLE=false
spring.h2.console.enabled=${H2_CONSOLE:true}
