spring.application.name=prueba

# Lee backend/.env si existe. En AWS se usan variables de entorno reales.
spring.config.import=optional:file:.env[.properties]

# Conexión con Oracle Service Cloud
oracle.base-url=${ORACLE_BASE_URL}
oracle.user=${ORACLE_USER}
oracle.password=${ORACLE_PASS}
oracle.api-version=v1.4
oracle.context-header=prueba tecnica


# ===================== Base de datos de respaldo (H2) =====================
# "file:" = la BD se guarda en un archivo (backend/data/), así el respaldo
# sobrevive si se reinicia el backend. Con "mem:" se perdería al apagarlo.
spring.datasource.url=jdbc:h2:file:./data/respaldo-contactos
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza las tablas a partir de las clases @Entity.
spring.jpa.hibernate.ddl-auto=update
# Buena práctica: no dejar la conexión a la BD abierta durante toda la petición web.
spring.jpa.open-in-view=false

# Consola web para ver las tablas: http://localhost:8080/h2-console
# En AWS se apaga con la variable de entorno H2_CONSOLE=false.
spring.h2.console.enabled=${H2_CONSOLE:true}
